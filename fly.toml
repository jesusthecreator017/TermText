# Fly.io deployment config for the TermText server.
# Setup:
#   fly launch --no-deploy            # create the app (keep this file)
#   fly postgres create               # provision Postgres
#   fly postgres attach <pg-app>      # sets DATABASE_URL secret on this app
#   fly secrets set DB_URL="$DATABASE_URL" PASETO_KEY=$(openssl rand -hex 32)
#   fly deploy

app = "termtext"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = ":8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # persistent WebSocket connections
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "get"
    path = "/health"
    interval = "15s"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
